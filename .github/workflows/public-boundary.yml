name: Public boundary check

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  public-boundary:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: dependency_test
          POSTGRES_PASSWORD: dependency_test
          POSTGRES_DB: dependency_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dependency_test -d dependency_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VERIQORN_TEST_DATABASE_URL: postgresql://dependency_test:dependency_test@localhost:5432/dependency_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify DCO sign-offs for pull requests
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          while IFS= read -r commit; do
            if ! git log -1 --format=%B "$commit" | grep -Eq '^Signed-off-by: .+ <.+>$'; then
              echo "Commit $commit is missing a Signed-off-by trailer." >&2
              echo 'Create commits with: git commit -s' >&2
              exit 1
            fi
          done < <(git rev-list "origin/$BASE_REF..HEAD")

      - name: Reject private implementation paths
        run: |
          forbidden=(
            'backend/src/enterprise-staging'
            'frontend/src/enterprise-staging'
            'license-issuer'
            'backend/extensions/enterprise-ai.manifest.json'
            'backend/uploads'
            'test/test-results'
          )
          for path in "${forbidden[@]}"; do
            if [ -e "$path" ]; then
              echo "Forbidden private path: $path" >&2
              exit 1
            fi
          done

      - name: Scan for common secret patterns
        run: |
          if rg -n \
            -g '!LICENSE' \
            -g '!NOTICE' \
            -g '!*.lock' \
            -e 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' \
            -e 'ghp_[A-Za-z0-9]{20,}' \
            .; then
            echo 'Potential secret detected.' >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install public workspace dependencies
        run: bun install --frozen-lockfile

      - name: Run Community source checks
        run: |
          bun run audit
          bun run check

      - name: Build Community images
        run: |
          docker build -f backend/Dockerfile -t veriqorn-backend:ci .
          docker build -f frontend/Dockerfile -t veriqorn-frontend:ci .

      - name: Inspect Community backend image boundary
        run: |
          docker run --rm --entrypoint sh veriqorn-backend:ci -c '
            test ! -e /app/backend/src/enterprise-staging &&
            test ! -e /app/backend/extensions/enterprise-ai.manifest.json &&
            test ! -e /app/backend/uploads &&
            test -f /app/backend/extensions/manifest.json
          '

      - name: Inspect Community frontend image boundary
        run: |
          docker run --rm --entrypoint sh veriqorn-frontend:ci -c '
            test ! -e /app/dist/extensions/enterprise-ai
          '
