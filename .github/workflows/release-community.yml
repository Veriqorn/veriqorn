name: Release Community images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Image version to publish (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    name: Verify release boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require the canonical release train
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_TRAIN_URL: https://raw.githubusercontent.com/Veriqorn/veriqorn-install/master/releases/release-train.json
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${GITHUB_REF_NAME}}"
          curl --fail-with-body --silent --show-error "$RELEASE_TRAIN_URL" > release-train.json
          jq -e --arg version "$version" '.schemaVersion == 1 and .version == $version' release-train.json > /dev/null

      - name: Reject private implementation paths
        run: |
          forbidden=(
            'backend/src/enterprise-staging'
            'frontend/src/enterprise-staging'
            'license-issuer'
            'backend/extensions/enterprise-ai.manifest.json'
            'backend/uploads'
            'test/test-results'
          )
          for path in "${forbidden[@]}"; do
            if [ -e "$path" ]; then
              echo "Forbidden private path: $path" >&2
              exit 1
            fi
          done

      - name: Scan for common secret patterns
        run: |
          if rg -n \
            -g '!LICENSE' \
            -g '!NOTICE' \
            -g '!*.lock' \
            -e 'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' \
            -e 'ghp_[A-Za-z0-9]{20,}' \
            .; then
            echo 'Potential secret detected.' >&2
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Run Community source checks
        run: |
          bun install --frozen-lockfile
          bun run check

      - name: Build and inspect Community images
        run: |
          docker build -f backend/Dockerfile -t veriqorn-community-backend:verify .
          docker build -f frontend/Dockerfile -t veriqorn-community-frontend:verify .
          docker run --rm --entrypoint sh veriqorn-community-backend:verify -c '
            test ! -e /app/backend/src/enterprise-staging &&
            test ! -e /app/backend/extensions/enterprise-ai.manifest.json &&
            test ! -e /app/backend/uploads &&
            test -f /app/backend/extensions/manifest.json
          '
          docker run --rm --entrypoint sh veriqorn-community-frontend:verify -c '
            test ! -e /app/dist/extensions/enterprise-ai
          '

  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: backend/Dockerfile
            image: veriqorn-backend
          - name: frontend
            dockerfile: frontend/Dockerfile
            image: veriqorn-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' || (github.ref_type == 'tag' && !contains(github.ref_name, '-')) }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@v3

      - name: Sign published image
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: |
          IMAGE="$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          cosign sign --yes "$IMAGE"
